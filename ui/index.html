<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSH Connector</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>

  <header class="titlebar" data-tauri-drag-region>
    <div class="title" data-tauri-drag-region><span class="app-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 8 4 4-4 4M13 16h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>SSH Connector</div>
    <button class="tb-btn" id="clipBtn" title="Área de transferência (Ctrl+Shift+V)"></button>
    <div class="caption">
      <button class="cap" data-win="min" title="Minimizar"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
      <button class="cap" data-win="max" title="Maximizar">
        <svg class="i-max" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" rx="1"/></svg>
        <svg class="i-restore" viewBox="0 0 10 10"><rect x="0.5" y="2.5" width="7" height="7" rx="1"/><path d="M2.5 2.5V1.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1"/></svg>
      </button>
      <button class="cap close" data-win="close" title="Fechar"><svg viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar glass">
      <div class="side-head">
        <span class="side-title">Máquinas</span>
        <button class="icon-btn" id="addHost" title="Nova máquina (Ctrl+N)"></button>
      </div>
      <label class="search">
        <span class="search-ico"></span>
        <input id="search" placeholder="Buscar" spellcheck="false" autocomplete="off" />
      </label>
      <nav id="hostList" class="host-list"></nav>
      <div class="side-foot">
        <span id="footInfo">—</span>
      </div>
    </aside>

    <main class="main">
      <div class="tabs" id="tabs"></div>
      <section class="stage glass" id="stage">
        <div class="empty" id="empty">
          <div class="empty-badge"></div>
          <h1>Seu servidor SSH, a um clique.</h1>
          <p>Escolha uma máquina para abrir um terminal.</p>
          <div class="quick" id="quick"></div>
        </div>
      </section>
    </main>
  </div>

  <aside class="clip glass-strong" id="clip" aria-label="Área de transferência">
    <div class="clip-head">
      <div>
        <div class="clip-title">Área de transferência</div>
        <div class="clip-sub" id="clipCount"></div>
      </div>
      <span class="grow"></span>
      <button class="pbtn" id="clipClear" hidden>Limpar</button>
      <button class="icon-btn" id="clipClose" title="Fechar (Esc)"></button>
    </div>
    <div class="clip-list" id="clipList"></div>
    <div class="clip-foot">Clique em um item para colar no terminal ativo · <kbd>1</kbd>–<kbd>9</kbd> atalhos<br>Fica só na memória — some ao fechar o app.</div>
  </aside>

  <div class="scrim" id="scrim"></div>
  <div class="sheet glass-strong" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toasts" id="toasts"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="app.js"></script>
</body>
</html>
